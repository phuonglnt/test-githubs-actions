name: CI

# Không có bộ test hình thức nào trong repo này - workflow này làm smoke test
# tối thiểu: mọi file .py biên dịch được, DB tạo được từ đầu, và app Flask
# khởi động + trả về /login = 200.
#
# Chạy 2 lần - 1 lần trên sqlite (giống local), 1 lần trên Postgres thật
# (giống Render khi có DATABASE_URL, xem dbcompat.py) - vì Postgres nghiêm
# ngặt hơn sqlite ở nhiều chỗ (vd GROUP BY) nên lỗi có thể chỉ lộ ra ở đây.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke-test-sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile app.py auth.py models.py translations.py dbcompat.py setup_db.py setup_users_db.py reset_and_start.py testdata.py

      - name: Build fresh databases
        run: |
          python setup_db.py
          python setup_users_db.py

      - name: Boot the app and walk through the main flow
        run: python .github/scripts/smoke_test.py

  smoke-test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: restaurant_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/restaurant_ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build fresh schema in Postgres
        run: |
          python setup_db.py
          python setup_users_db.py

      - name: Boot the app and walk through the main flow
        run: python .github/scripts/smoke_test.py
