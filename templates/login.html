{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}

<div class="login-page">
  <form class="login-card" method="POST" action="{{ url_for('login') }}">
    <h1 class="login-title">Restaurant de Valentine</h1>
    <p class="login-subtitle">{{ t('login_subtitle') }}</p>

    {% if error %}
    <p class="login-error">{{ error }}</p>
    {% endif %}

    <label class="login-label">{{ t('login_username') }}</label>
    <input class="login-input" type="text" name="username" autofocus required>

    <label class="login-label">{{ t('login_password') }}</label>
    <input class="login-input" type="password" name="password" required>

    <button class="login-button" type="submit">{{ t('login_submit') }}</button>
  </form>
</div>

{% endblock %}
